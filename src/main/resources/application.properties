spring.application.name=incident-management-platform
server.port=${PORT:8081}
spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/incidents
spring.datasource.username=incident_user
spring.datasource.password=incident_pass
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.cache.type=redis
spring.cache.cache-names=incident
spring.cache.redis.time-to-live=5m

# AI-powered incident triage
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=gemini-3.8-flash